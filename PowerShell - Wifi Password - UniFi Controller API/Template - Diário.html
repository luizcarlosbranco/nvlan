<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallpaper Corporativo</title>

<style>
body{
    font-family:"Segoe UI",Arial,sans-serif;
}

:root{
    --blue:#063f78;
    --dark:#032f5d;
    --cyan:#00a9e0;
    --muted:#6c8192;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Segoe UI",Arial,sans-serif;
    background:var(--blue)
}

.wallpaper{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    user-select:none;
    background:
        radial-gradient(circle at 72% 35%,#00a9e01a,transparent 28%),
        linear-gradient(115deg,#fff,#f6f9fb 48%,#e8f0f5)
}

/* Fundo */
.blue-panel{
    position:absolute;
    top:-16.67vh;
    right:-14.06vw;
    width:51.04vw;
    height:134.26vh;
    background:linear-gradient(145deg,var(--blue),var(--dark));
    transform:rotate(7deg)
}

.geometry{
    position:absolute;
    pointer-events:none
}

.geometry.one{
    top:9.26vh;
    right:9.375vw;
    width:23.44vw;
    height:41.67vh;
    border:1px solid #fff1;
    border-radius:50%
}

.geometry.two{
    top:29.17vh;
    right:2.6vw;
    width:29.69vw;
    height:2px;
    background:#00a9e073;
    transform:rotate(-35deg)
}

.geometry.three{
    left:0;
    bottom:0;
    width:22.4vw;
    height:2px;
    background:var(--cyan)
}

/* Cabeçalho */
.header{
    position:absolute;
    z-index:20;
    top:5.09vh;
    inset-inline:3.75vw;
    height:8.8vh;
    display:flex;
    align-items:center;
    justify-content:flex-end
}

.company-logo{
    width:17.19vw;
    min-width:150px;
    max-width:330px
}

/* Conteúdo */
.main-content{
    position:absolute;
    z-index:10;
    top:17.5vh;
    left:8vw;
    width:39.58vw
}

.kicker{
    display:flex;
    align-items:center;
    gap:.73vw;
    margin-bottom:2.04vh;
    color:var(--blue);
    font-size:.677vw;
    font-weight:700;
    letter-spacing:.156vw;
    text-transform:uppercase
}

.kicker:before{
    content:"";
    width:2.5vw;
    height:2px;
    background:var(--cyan)
}

.main-title{
    color:var(--dark);
    font-size:clamp(42px,3.438vw,66px);
    line-height:1.03;
    letter-spacing:-.156vw;
    font-weight:800
}

.main-title span{color:var(--blue)}

.description{
    width:31.25vw;
    margin-top:2.59vh;
    color:var(--muted);
    font-size:clamp(12px,.885vw,17px);
    line-height:1.7
}

/* Imagem */
.qrcode-container{
    position:absolute;
    z-index:10;
    top:22.4vh;
    right:3.75vw;
    width:24vw;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.qrcode{
    position:relative;
    width:100%;
    aspect-ratio:1;
    overflow:hidden;
    border-radius:1.04vw;
    background:var(--dark);
    box-shadow:0 2.31vw 5.56vh #0123432e;
}

.qrcode > .qrcode-image{
    width:100%;
    height:100%;
    display:block;
    object-fit:fill;
}

.qrcode-center-logo{
    position:absolute;
    z-index:2;
    top:50%;
    left:50%;
    width:20%;
    height:20%;
    transform:translate(-50%,-50%);
    object-fit:contain;
    background:#fff;
    border-radius:0;
    padding:1%;
}

.qrcode:after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:4px;
    background:var(--cyan);
}

.wifi-icon{
    display:inline-block;
    width:1.55vw;
    height:1.55vw;
    margin-right:.35vw;
    object-fit:contain;
    vertical-align:-.15vw;
}

.lock-icon{
    width:1.35vw;
    height:1.35vw;
}

/* Calendário */
.calendar-card{
    position:absolute;
    z-index:20;
    left:8vw;
    bottom:10vh;
    width:42.71vw;
    padding:2.31vh 1.46vw 2.5vh;
    background:#fffffff7;
    border-radius:.94vw;
    box-shadow:0 1.85vw 5.56vh #022d5024
}

.calendar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:1.57vh
}

.month{
    color:var(--dark);
    font-size:1.2vw;
    font-weight:800;
    text-transform:none;
}

.month small{
    margin-left:.42vw;
    color:var(--blue);
    font-size:.78vw;
    font-weight:600
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:.26vw
}

.day-name{
    padding-bottom:.74vh;
    color:#8a9aa6;
    text-align:center;
    font-size:.47vw;
    font-weight:700;
    letter-spacing:.052vw;
    text-transform:uppercase
}

#calendarDays{display:contents}

.day{
    height:4.63vh;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:.42vw;
    color:#42596b;
    font-size:.677vw;
    font-weight:600
}

.day.current-week{
    background:#e4f1f8;
    color:var(--dark)
}

.day.today{
    background:var(--blue);
    color:white;
    font-weight:800;
    box-shadow:0 5px 14px rgba(0,63,120,.25);
}

.day.today::after{
    content:"";
    position:absolute;
    bottom:6px;
    width:4px;
    height:4px;
    background:var(--cyan);
    border-radius:50%;
}

.day.current-week.week-start{border-radius:.52vw 0 0 .52vw}
.day.current-week.week-end{border-radius:0 .52vw .52vw 0}

/* Wi-Fi */
.week-panel{
    position:absolute;
    z-index:15;
    right:3.75vw;
    top:calc(22.4vh + 1.2vh + 1.35vw * 1.2 + 1.2vh + 24vw + 3vh);
    width:24vw;
    color:#fff;
    text-align:center;
}

.wifi-title,
.wifi-info{
    font-family:"Segoe UI",Arial,sans-serif;
    color:#fff;
    font-weight:600;
    letter-spacing:-.04vw;
}

.wifi-title{
    width:100%;
    margin-bottom:1.2vh;
    text-align:center;
    font-size:1.8vw;
    line-height:1.2;
}

.wifi-info{
    font-size:1.45vw;
    line-height:1.35;
}

.wifi-password{
    margin-top:.65vh;
}

.wifi-info span{
    color:var(--cyan);
}

.week-line{
    width:3.23vw;
    height:2px;
    margin:1.94vh auto 1.94vh;
    background:var(--cyan);
}

/* Responsivo */
@media(max-height:850px){
    .header{top:3.5vh}
    .main-content{top:18vh}
    .qrcode-container{top:17vh}

    .calendar-card{
        bottom:6vh;
    }

    .week-panel{bottom:4.5vh}
    .day{height:4vh}
}

@media(max-aspect-ratio:4/3){
    .blue-panel{right:-20vw;width:58vw}
    .main-content{width:40vw}
    .calendar-card{width:44vw}
    .week-panel{width:41vw}
}
</style>
</head>

<body>

<script>
const meses=[
    "janeiro","fevereiro","março","abril","maio","junho",
    "julho","agosto","setembro","outubro","novembro","dezembro"
];

function inicioSemana(data){
    const d=new Date(data);
    const dia=d.getDay();

    d.setDate(d.getDate()+(dia===0?-6:1-dia));
    d.setHours(0,0,0,0);

    return d;
}

function construirCalendario(){
    const hoje=new Date();
    const ano=hoje.getFullYear();
    const mes=hoje.getMonth();
    const diaAtual=hoje.getDate();

    const primeiro=new Date(ano,mes,1);
    const inicio=primeiro.getDay();
    const total=new Date(ano,mes+1,0).getDate();

    const semanaInicio=inicioSemana(hoje);
    const semanaFim=new Date(semanaInicio);

    semanaFim.setDate(semanaFim.getDate()+6);

    /*
     * Exibe:
     * 28 de agosto de 2026
     *
     * Todo o texto usa a mesma fonte/tamanho
     * definida em .month.
     */
    document.getElementById("month").textContent=
        `${diaAtual} de ${meses[mes]} de ${ano}`;

    const container=document.getElementById("calendarDays");
    container.innerHTML="";

    for(let i=0;i<inicio;i++)
        container.appendChild(document.createElement("div"));

    for(let dia=1;dia<=total;dia++){
        const data=new Date(ano,mes,dia);
        const elemento=document.createElement("div");
        const diaSemana=data.getDay();

        elemento.className="day";
        elemento.textContent=dia;

        if(
            data>=semanaInicio &&
            data<=semanaFim &&
            diaSemana>=1 &&
            diaSemana<=5
        ){
            elemento.classList.add("current-week");

            if(diaSemana===1)
                elemento.classList.add("week-start");

            if(diaSemana===5)
                elemento.classList.add("week-end");
        }

        container.appendChild(elemento);
    }
}

function atualizarNoProximoDia(){
    const agora=new Date();

    const amanha=new Date(
        agora.getFullYear(),
        agora.getMonth(),
        agora.getDate()+1,
        0,0,1
    );

    setTimeout(()=>location.reload(),amanha-agora);
}

construirCalendario();
atualizarNoProximoDia();
</script>
